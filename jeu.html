<html lang="fr">
<head>

    <title>L'Empire du Sous-Sol - Tableau de Bord</title>
    
    <!-- ÉTAPE A : Chargement obligatoire des modules de sécurité en premier -->
    <script src="https://jsdelivr.net"></script>
    <script src="security.js"></script>

    <!-- Vos fichiers de styles pour le jeu -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div style="padding: 20px; max-width: 800px; margin: auto;">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <h2>Console de Gestion Minière</h2>
            <!-- ÉTAPE B : Bouton doté de l'ID "btnLogout" pour déclencher la sécurité -->
            <button id="btnLogout" style="background: #951515; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                ❌ Quitter la session
            </button>
        </header>

        <main style="margin-top: 20px;">
            <p>Félicitations, cette zone est sécurisée. Vos données financières et l'état de vos filons sont protégés par chiffrement.</p>
            <!-- Le reste de vos tableaux de gestion et listes de carrières se place ici -->
        </main>
    </div>
